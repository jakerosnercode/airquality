<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Data Collector for AGOL</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
    }

    #appContainer {
      position: relative;
      height: 100%;
      width: 100%;
    }

    #viewDiv {
      height: 100%;
      width: 100%;
    }

    .addRecordBtn {
      position: absolute;
      z-index: 99; /* ensure it's above the map and widgets */
      top: 10px;
      right: 10px;
      background-color: #0079c1;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
    }

    .addRecordBtn:hover {
      background-color: #005a87;
    }
  </style>

  <link rel="stylesheet" href="https://js.arcgis.com/4.26/esri/themes/light/main.css" />
  <script src="https://js.arcgis.com/4.26/"></script>

  <script>
    require([
      "esri/config",
      "esri/Map",
      "esri/views/MapView",
      "esri/widgets/Locate",
      "esri/widgets/Search",
      "esri/layers/FeatureLayer"
    ], (esriConfig, Map, MapView, Locate, Search, FeatureLayer) => {

    
      esriConfig.apiKey = "AAPTxy8BH1VEsoebNVZXo8HurEMEVQbKvAbZnpzPKZRxuMNtUzDq8ag3E3FbEUVJMU0hrtmVGRJepK1vokNRd6QHYHvJ59WIxIBvBCEs9cPVdWnD4aXedEaWZSNwNzqqh5gyGL2CcmseyfeF5Gt8e3Mi7KdSA7BcKz3dTA6_yKBu_g1SbTFM-Zp9MUafCKP5vn2qhGgQBFLx91QEhf6EinAD207CcjqmQhLAFQ4sF6MsT9U.AT1_xORu7DFJ
";

      const map = new Map({
        basemap: "satellite" // Basemap type
      });

      const view = new MapView({
        container: "viewDiv",
        map: map,
        center: [-98, 39], // Default center on the US
        zoom: 4
      });

      const locateBtn = new Locate({
        view: view
      });

      // Feature Layer for AQI data
      const aqiRenderer = {
        type: "simple",
        symbol: {
          type: "simple-marker",
          style: "circle",
          size: 12,
          color: "gray"
        },
        visualVariables: [
          {
            type: "color",
            field: "AQI", // Field to apply color on
            stops: [
              { value: 50, color: "green", label: "Good (0–50)" },
              { value: 100, color: "yellow", label: "Moderate (51–100)" },
              { value: 150, color: "red", label: "Unhealthy (101+)" }
            ]
          }
        ]
      };

      const aqiLayer = new FeatureLayer({
        url: "https://services.arcgis.com/LBbVDC0hKPAnLRpO/arcgis/rest/services/AQI_Data/FeatureServer",
        outFields: ["*"],
        renderer: aqiRenderer,
        popupTemplate: {
          title: "{City}, {State}",
          content: "AQI: {AQI}"
        }
      });

      map.add(aqiLayer);

      // Search widget to search for locations
      const searchWidget = new Search({
        view: view,
        locationEnabled: true,
        resultGraphicEnabled: true,
        popupEnabled: true
      });

      view.when(() => {
        view.ui.add(locateBtn, "top-left");
        view.ui.add(searchWidget, "bottom-right");
      });

    });
  </script>
</head>
<body>
  <div id="appContainer">
    <div id="viewDiv"></div>
    <a href="https://arcg.is/1WzjCP1" target="_blank" class="addRecordBtn">Add Record</a>
  </div>
</body>
</html>
